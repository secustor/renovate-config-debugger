[tools]
node = "26.8.1"
pnpm = "11.23.0"

[hooks]
# Local convenience only. CI must NOT install here: jdx/mise-action runs
# `mise install`, which fires this hook — that would run a full, uncached
# install *before* the workflow restores the pnpm store cache, so the cache
# would be restored after the only step that could have used it. CI installs
# explicitly (and frozen) after the cache step instead.
postinstall = '''
[ -n "$CI" ] || pnpm install
'''

# The "rebuild & diff" half of "verify this build" (roadmap 088) — what the
# app's popover tells a verifier to run after clone + checkout + mise install.
[tasks.verify-build]
description = "Rebuild the app from this checkout and diff it against a deployment"
run = '''
pnpm install
pnpm --filter @renovate-config-debugger/app build
node tools/verify-deployment.ts "$@"
'''

[settings]
# needed for hooks
experimental = true
