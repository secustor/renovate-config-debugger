# Roadmap 043 — the served-site policy for the `app` image.
#
# nginx's `add_header` does NOT merge: a location that sets any header replaces
# the whole inherited set, so every location below repeats `nosniff` rather than
# relying on the server-level one.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # text/html is always compressed by nginx and cannot be listed here.
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    # Default for everything not matched below: safe to re-fetch, never sniffed.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache" always;

    # Vite writes content-hashed filenames here, so the contents can never change
    # under a given URL.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The two files a deployment rewrites in place — never cached.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
    }

    location = /rcd-config.js {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
    }

    # The app routes through the hash/query only, so this fallback never fires
    # for a real navigation — it just keeps a hand-typed path from 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
