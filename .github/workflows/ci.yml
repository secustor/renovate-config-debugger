name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Enforce renovate/dist import boundary
        run: |
          violations=$(grep -rln "renovate/dist" packages/engine/src packages/app/src \
            | grep -v "packages/engine/src/renovate-adapter.ts" \
            | grep -v "packages/engine/src/shims/" \
            | grep -v "packages/engine/src/types/" || true)
          if [ -n "$violations" ]; then
            echo "renovate/dist may only be imported from renovate-adapter.ts, shims/ and types/:"
            echo "$violations"
            exit 1
          fi

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm -r typecheck
      - name: Golden tests (real renovate modules)
        run: pnpm --filter @renovate-config-visualizer/engine test:golden
      - name: Shimmed tests (browser module graph)
        run: pnpm --filter @renovate-config-visualizer/engine test:shimmed
      - name: OAuth worker tests
        run: pnpm --filter @renovate-config-visualizer/oauth-worker test
      - name: App unit tests (pure modules — the run digest, …)
        run: pnpm --filter @renovate-config-visualizer/app test:unit
      - name: Dev module graph (Node-only import leaks)
        # `vite dev` serves renovate's transitive deps raw (no CJS interop),
        # a regime neither the Node tests nor the production build exercise.
        run: pnpm --filter @renovate-config-visualizer/app check:dev-graph
      - name: Browser bundle build
        # Sign-in (009) is enabled only when these repo Actions variables are
        # set; absent = empty string = feature cleanly off (PAT UX remains).
        env:
          VITE_GITHUB_CLIENT_ID: ${{ vars.VITE_GITHUB_CLIENT_ID }}
          VITE_OAUTH_WORKER_URL: ${{ vars.VITE_OAUTH_WORKER_URL }}
          VITE_GITHUB_APP_SLUG: ${{ vars.VITE_GITHUB_APP_SLUG }}
        run: pnpm --filter @renovate-config-visualizer/app build

      - name: Install Playwright chromium
        # Only chromium, with its OS deps — the e2e suite is chromium-only.
        run: pnpm --filter @renovate-config-visualizer/app exec playwright install --with-deps chromium
      - name: Browser e2e tests
        # Drives the production dist built above via `vite preview` (reuses that
        # output, never rebuilds). GITHUB_ACTIONS is set here, so both vite's
        # base path and the Playwright baseURL resolve to /renovate-config-visualizer/.
        run: pnpm --filter @renovate-config-visualizer/app test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: packages/app/playwright-report
          retention-days: 7
          if-no-files-found: ignore

      # Pages deployment is opt-in: the repo is private and GitHub Pages for
      # private repos needs a paid plan, so the deploy job would always fail.
      # To publish the site, enable Pages (build type "GitHub Actions") in the
      # repo settings and set the repository Actions variable DEPLOY_PAGES=true.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
        with:
          path: packages/app/dist

  deploy:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
