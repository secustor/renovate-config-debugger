name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The renovate/dist import boundary is enforced by oxlint's
      # `no-restricted-imports` (see .oxlintrc.json overrides) — same guarantee
      # as the grep step this replaces, but visible in the editor too.
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm -r typecheck
      - name: Golden tests (real renovate modules)
        run: pnpm --filter @renovate-config-visualizer/engine test:golden
      - name: Shimmed tests (browser module graph)
        run: pnpm --filter @renovate-config-visualizer/engine test:shimmed
      - name: OAuth worker tests
        run: pnpm --filter @renovate-config-visualizer/oauth-worker test
      - name: App unit tests (pure modules — the run digest, …)
        run: pnpm --filter @renovate-config-visualizer/app test:unit
      - name: Dev module graph (Node-only import leaks)
        # `vite dev` serves renovate's transitive deps raw (no CJS interop),
        # a regime neither the Node tests nor the production build exercise.
        run: pnpm --filter @renovate-config-visualizer/app check:dev-graph
      - name: Browser bundle build
        # Sign-in (009) and Google Analytics are enabled only when these repo
        # Actions variables are set; absent = empty string = feature cleanly
        # off (PAT UX remains, no analytics).
        env:
          VITE_GITHUB_CLIENT_ID: ${{ vars.VITE_GITHUB_CLIENT_ID }}
          VITE_OAUTH_WORKER_URL: ${{ vars.VITE_OAUTH_WORKER_URL }}
          VITE_GITHUB_APP_SLUG: ${{ vars.VITE_GITHUB_APP_SLUG }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
        run: pnpm --filter @renovate-config-visualizer/app build
      - name: Critical-path entry-set sizes (roadmap 031)
        # Prints the gzip size of everything fetched before first paint (the
        # entry script + its modulepreload graph + the stylesheet), so a chunk
        # sliding back into the entry set is visible next to the build.
        run: node packages/app/scripts/report-entry-size.mjs

      - name: Install Playwright chromium
        # Only chromium, with its OS deps — the e2e suite is chromium-only.
        run: pnpm --filter @renovate-config-visualizer/app exec playwright install --with-deps chromium
      - name: Browser e2e tests
        # Drives the production dist built above via `vite preview` (reuses that
        # output, never rebuilds). Base is "/" everywhere — the site serves
        # from the domain root (renovate.secustor.dev).
        run: pnpm --filter @renovate-config-visualizer/app test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: packages/app/playwright-report
          retention-days: 7
          if-no-files-found: ignore

      # Pages deployment is opt-in: the repo is private and GitHub Pages for
      # private repos needs a paid plan, so the deploy job would always fail.
      # To publish the site, enable Pages (build type "GitHub Actions") in the
      # repo settings and set the repository Actions variable DEPLOY_PAGES=true.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
        with:
          path: packages/app/dist

  deploy:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # Roadmap 009 — deploys the GitHub OAuth token-exchange proxy to Cloudflare
  # Workers. Opt-in like the Pages deploy above: set the repo Actions variable
  # DEPLOY_OAUTH_WORKER=true once Cloudflare + the GitHub App are provisioned
  # (see packages/oauth-worker/README.md#provisioning). Runs on every main
  # push, not path-filtered — `wrangler deploy` is fast and idempotent.
  deploy-oauth-worker:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_OAUTH_WORKER == 'true'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      # No `pnpm install` — wrangler is invoked via `pnpm dlx` and bundles the
      # Worker itself. `wrangler deploy` REPLACES dashboard-set vars on every
      # run, so GITHUB_CLIENT_ID is not committed to wrangler.jsonc; it is
      # threaded through from the same repo variable (VITE_GITHUB_CLIENT_ID)
      # that configures the app build — one source of truth for the client id.
      - name: Deploy the OAuth worker
        working-directory: packages/oauth-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_CLIENT_ID: ${{ vars.VITE_GITHUB_CLIENT_ID }}
        run: pnpm dlx wrangler deploy --var GITHUB_CLIENT_ID:$GITHUB_CLIENT_ID

  # Roadmap 043 — the self-host images. Push-only (i.e. main), because a PR
  # from a fork has no package-write token and an untagged PR image has no
  # consumer. The Dockerfile builds the app WITHOUT any VITE_* variables: these
  # images are configured at `docker run` time, not baked.
  docker:
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # arm64 is emulated; the app image's heavy work (pnpm install + the vite
      # build) happens once per platform, so the gha cache below matters.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta-app
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/secustor/renovate-config-visualizer
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - id: meta-oauth-proxy
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/secustor/renovate-config-visualizer-oauth-proxy
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push the app image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Build and push the oauth-proxy image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: oauth-proxy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-oauth-proxy.outputs.tags }}
          labels: ${{ steps.meta-oauth-proxy.outputs.labels }}
          cache-from: type=gha,scope=oauth-proxy
          cache-to: type=gha,scope=oauth-proxy,mode=max
