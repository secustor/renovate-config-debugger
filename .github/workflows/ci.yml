name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache: true

      # Resolved, not hardcoded: mise-installed pnpm does not use the store path
      # that pnpm/action-setup produced.
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile --prefer-offline

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm -r typecheck
      - name: Golden tests (real renovate modules)
        run: pnpm --filter @renovate-config-visualizer/engine test:golden
      - name: Shimmed tests (browser module graph)
        run: pnpm --filter @renovate-config-visualizer/engine test:shimmed
      - name: OAuth worker tests
        run: pnpm --filter @renovate-config-visualizer/oauth-worker test
      - name: App unit tests (pure modules — the run digest, …)
        run: pnpm --filter @renovate-config-visualizer/app test:unit
      - name: Dev module graph (Node-only import leaks)
        # `vite dev` serves renovate's transitive deps raw (no CJS interop),
        # a regime neither the Node tests nor the production build exercise.
        run: pnpm --filter @renovate-config-visualizer/app check:dev-graph
      - name: Browser bundle build
        # Sign-in (009) and Google Analytics are enabled only when these repo
        # Actions variables are set; absent = empty string = feature cleanly
        # off (PAT UX remains, no analytics).
        env:
          VITE_GITHUB_CLIENT_ID: ${{ vars.VITE_GITHUB_CLIENT_ID }}
          VITE_OAUTH_WORKER_URL: ${{ vars.VITE_OAUTH_WORKER_URL }}
          VITE_GITHUB_APP_SLUG: ${{ vars.VITE_GITHUB_APP_SLUG }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
        run: pnpm --filter @renovate-config-visualizer/app build
      - name: Critical-path entry-set sizes (roadmap 031)
        # Prints the gzip size of everything fetched before first paint (the
        # entry script + its modulepreload graph + the stylesheet), so a chunk
        # sliding back into the entry set is visible next to the build.
        run: node packages/app/scripts/report-entry-size.mjs

      # Keyed on the resolved Playwright version rather than the lockfile: the
      # browser build only changes when Playwright does, so an unrelated dep
      # bump must not force a re-download.
      - id: playwright-version
        working-directory: packages/app
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright chromium
        # Only chromium, with its OS deps — the e2e suite is chromium-only.
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @renovate-config-visualizer/app exec playwright install --with-deps chromium

      - name: Install Playwright OS deps
        # The cache covers ~/.cache/ms-playwright (the browser binaries) but not
        # the apt packages `--with-deps` pulls in, so those are still needed on a
        # hit. Cheap — most are already on the runner image.
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @renovate-config-visualizer/app exec playwright install-deps chromium
      - name: Browser e2e tests
        # Drives the production dist built above via `vite preview` (reuses that
        # output, never rebuilds). Base is "/" everywhere — the site serves
        # from the domain root (renovate.secustor.dev).
        run: pnpm --filter @renovate-config-visualizer/app test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: packages/app/playwright-report
          retention-days: 7
          if-no-files-found: ignore

      # Pages deployment is opt-in: the repo is private and GitHub Pages for
      # private repos needs a paid plan, so the deploy job would always fail.
      # To publish the site, enable Pages (build type "GitHub Actions") in the
      # repo settings and set the repository Actions variable DEPLOY_PAGES=true.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
        with:
          path: packages/app/dist

  deploy:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # Roadmap 009 — deploys the GitHub OAuth token-exchange proxy to Cloudflare
  # Workers. Opt-in like the Pages deploy above: set the repo Actions variable
  # DEPLOY_OAUTH_WORKER=true once Cloudflare + the GitHub App are provisioned
  # (see packages/oauth-worker/README.md#provisioning). Runs on every main
  # push, not path-filtered — `wrangler deploy` is fast and idempotent.
  deploy-oauth-worker:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_OAUTH_WORKER == 'true'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache: true

      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # Shares the `checks` job's cache entries — same key, and this job's
      # narrower install is a subset of that store.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      # Only the worker package's deps — the deploy needs wrangler (a pinned
      # devDependency there), not the app workspace.
      - run: pnpm install --frozen-lockfile --prefer-offline --filter @renovate-config-visualizer/oauth-worker

      # `wrangler deploy` REPLACES dashboard-set vars on every run, so
      # GITHUB_CLIENT_ID is not committed to wrangler.jsonc; it is threaded
      # through from the same repo variable (VITE_GITHUB_CLIENT_ID) that
      # configures the app build — one source of truth for the client id.
      - name: Deploy the OAuth worker
        working-directory: packages/oauth-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_CLIENT_ID: ${{ vars.VITE_GITHUB_CLIENT_ID }}
        run: pnpm run deploy --var GITHUB_CLIENT_ID:$GITHUB_CLIENT_ID

  # Roadmap 043 — the self-host images. Push-only (i.e. main), because a PR
  # from a fork has no package-write token and an untagged PR image has no
  # consumer. The Dockerfile builds the app WITHOUT any VITE_* variables: these
  # images are configured at `docker run` time, not baked.
  #
  # One job per (image × platform), each on a runner of that architecture —
  # `ubuntu-24.04-arm` is a native arm64 hosted runner, so nothing is emulated
  # any more and both architectures build in parallel instead of back to back.
  # Each job pushes an untagged, single-platform image and hands its digest to
  # `docker-merge`, which stitches the tagged manifest list together.
  docker:
    needs: checks
    if: github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    # Unchanged at 30 even though a native single-platform build is much cheaper
    # than the emulated one: the timeout is here to cap the stall class that
    # once left this job wedged for 90+ minutes, not to be tight. (The arm64
    # runner is 4 vCPU like ubuntu-latest and free, this repo being public; in
    # a private repo it would be 2 vCPU and the headroom would earn its keep.)
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      # No fail-fast: a failure on one architecture should still show whether
      # the other one is healthy — that difference is the whole diagnosis.
      fail-fast: false
      matrix:
        target: [app, oauth-proxy]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - target: app
            image: ghcr.io/secustor/renovate-config-visualizer
          - target: oauth-proxy
            image: ghcr.io/secustor/renovate-config-visualizer-oauth-proxy
    steps:
      # `linux/amd64` is not usable in a cache tag or an artifact name.
      - id: platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No setup-qemu-action: every job builds only its own architecture.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only for the labels here — the tags are applied to the manifest list in
      # `docker-merge`, since these builds push by digest and stay untagged.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}

      - id: build
        name: Build and push by digest
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # push-by-digest uploads the image without a tag and returns its
          # digest; `name-canonical` still records the repository so the blobs
          # land in the right package.
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          # A registry cache rather than type=gha: the GitHub Actions cache is
          # one 10 GB LRU budget shared with the pnpm store and the Playwright
          # browsers in `checks`, and a mode=max export of the app image (whose
          # build stage carries the whole workspace node_modules) is large
          # enough to evict them. GHCR has no such budget, is readable from
          # every branch rather than just the one that wrote it, and only
          # uploads blobs it does not already hold. One ref per platform is
          # mandatory, not tidiness: a shared ref would have each architecture
          # overwrite the other's cache manifest.
          cache-from: type=registry,ref=${{ matrix.image }}:buildcache-${{ steps.platform.outputs.pair }}
          cache-to: type=registry,ref=${{ matrix.image }}:buildcache-${{ steps.platform.outputs.pair }},mode=max,image-manifest=true,oci-mediatypes=true

      # An empty file named after the digest; the merge job globs the directory.
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.target }}-${{ steps.platform.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # The tagging half of `docker`: collects the per-platform digests of one image
  # and publishes them as a single multi-platform manifest list. Cheap enough to
  # run on amd64 — it moves no layers, only manifests.
  docker-merge:
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: app
            image: ghcr.io/secustor/renovate-config-visualizer
          - target: oauth-proxy
            image: ghcr.io/secustor/renovate-config-visualizer-oauth-proxy
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.target }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Create the manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      # Fails loudly if a platform is missing from the published list — the one
      # failure mode of this split that a green build job would otherwise hide.
      - name: Inspect the manifest
        env:
          REF: ${{ matrix.image }}:${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$REF"
