name: Publish CLI

# Roadmap 059 — publishes @renovate-config-debugger/cli to npm.
#
# Release-triggered only: nothing on this workflow runs on a push to main, so
# a merge can never publish. A release is cut by tagging `cli-v<version>`
# (which must match packages/cli/package.json's version — the job checks) and
# publishing the GitHub release.
#
# Running it by hand dry-runs by default; unchecking `dry-run` publishes, for
# the re-publish case a cut release cannot repeat — but only from the `cli-v*`
# tag naming the version in packages/cli/package.json, which the job checks on
# both paths. A publish is permanent, so an unmerged ref must not reach one.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and verify without publishing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    # Releases for the OTHER publishable packages (056's engine) share this
    # repository's tags, so a tag that is not ours is not our release.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'cli-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # npm provenance: the attestation is signed with this job's OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # Whatever the trigger, anything that publishes must be standing on a tag
      # that names the version it publishes: the release's own tag, or — for a
      # hand-dispatched re-publish — the `cli-v*` tag the run was dispatched
      # from. Dispatching a publish from a branch is refused here: a version
      # can never be re-published, so a tarball built from an unmerged ref
      # would own that version forever.
      - name: The ref names the version being published
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.dry-run == false)
        env:
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ "$TAG" != "cli-v$version" ]; then
            echo "ref $TAG does not name packages/cli version $version" >&2
            echo "dispatch a publish from the cli-v$version tag, or cut a release" >&2
            exit 1
          fi

      # The zero-tolerance gates, on the exact tree being published.
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm --filter @renovate-config-debugger/cli test

      # `build` runs scripts/check-compat.ts, which fails when the README's
      # compat table does not describe this tree's dependencies.
      - name: Build the SSR bundle
        run: pnpm --filter @renovate-config-debugger/cli build

      # …and only here, where a release is actually being cut, must the row's
      # `cli` cell name the version about to be published. Requiring that on
      # every build would make each automated Renovate bump red until someone
      # bumped the CLI version and added a row for a release nobody is cutting.
      - name: Compat table names this release
        run: node packages/cli/scripts/check-compat.ts --release

      # The parity proof: the engine's own shimmed snapshot suite, re-run with
      # the engine pointed at dist/engine-surface.js. "The bundle is the same
      # module graph" is TESTED against the artifact that ships, not assumed
      # from both having been built with the same plugin.
      - name: Bundle parity (engine shimmed snapshots vs. the bundle)
        run: pnpm --filter @renovate-config-debugger/cli test:bundle

      - name: Smoke-test the published bin
        run: node packages/cli/bin/rcd.mjs validate packages/cli/test/fixtures/clean.json

      # AGPL-3.0-only is stated in package.json and `files` lists LICENSE; the
      # text itself lives at the repo root, and packages/cli/scripts/prepack.ts
      # copies it in — a hook both steps below trigger, so the tarball carries
      # it whoever builds it, not only this workflow.
      - name: Publish to npm
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.dry-run == false)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          pnpm --filter @renovate-config-debugger/cli publish --access public --no-git-checks

      - name: Dry run only
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run != false
        run: pnpm --filter @renovate-config-debugger/cli publish --dry-run --no-git-checks
