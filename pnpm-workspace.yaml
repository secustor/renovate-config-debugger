packages:
  - packages/*

allowBuilds:
  core-js-pure: false
  dtrace-provider: false
  # esbuild and workerd (via wrangler) get their platform binaries from
  # optionalDependencies; their install scripts only re-validate the binary.
  esbuild: false
  re2: false
  workerd: false

ignoredBuiltDependencies:
  - core-js-pure
  - dtrace-provider
  - esbuild
  - re2
  - workerd

overrides:
  # miniflare directly pins a version so this is overwriting to an range starting with a not effected version
  miniflare>undici: ^8.0.0

patchedDependencies:
  codemirror-json-schema@0.8.1: patches/codemirror-json-schema@0.8.1.patch
