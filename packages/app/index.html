<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Debug your Renovate config by stepping through what Renovate actually does with it — parsing, migration, validation, preset resolution and packageRules matching — powered by Renovate's own code running in your browser."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Renovate Config Debugger</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Roadmap 043: deployment-time config, served verbatim from public/ so it
      never 404s. `defer` keeps it off the parser's critical path while still
      running before the module below (both queue as deferred, in tree order),
      which matters because the module reads what this file defines.
    -->
    <script defer src="/rcv-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
