<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Debug your Renovate config by stepping through what Renovate actually does with it — parsing, migration, validation, preset resolution and packageRules matching — powered by Renovate's own code running in your browser."
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0969da" />
    <meta property="og:title" content="Renovate Config Debugger" />
    <meta
      property="og:description"
      content="Step through what Renovate actually does with your config — in your browser."
    />
    <meta property="og:type" content="website" />
    <!-- Crawlers need absolute URLs; self-hosted deployments simply serve the
         production card, which names no host. -->
    <meta property="og:url" content="https://renovate.secustor.dev/" />
    <meta property="og:image" content="https://renovate.secustor.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Renovate Config Debugger</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Roadmap 043: deployment-time config, served verbatim from public/ so it
      never 404s. `defer` keeps it off the parser's critical path while still
      running before the module below (both queue as deferred, in tree order),
      which matters because the module reads what this file defines.
    -->
    <script defer src="/rcv-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
